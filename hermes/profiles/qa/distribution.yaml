name: viki-qa
version: 1.0.0
description: Slovenský viki asistent na otázky a prácu s používateľskou pamäťou
hermes_requires: "==0.19.0"
author: viki
env_requires:
  - name: OPENAI_API_KEY
    description: OpenAI API kľúč pre model asistenta
    required: false
  - name: VIKI_HERMES_TOOL_TOKEN
    description: Interné overenie privátneho nástrojového API viki
    required: true
distribution_owned:
  - distribution.yaml
  - config.yaml
  - SOUL.md
  - .no-bundled-skills
  - plugins/viki
