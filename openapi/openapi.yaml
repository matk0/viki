openapi: 3.1.0
info:
  title: viki API
  version: 2.0.0
  description: Versioned API for the company specification wiki and its Hermes-backed assistant host.
servers:
  - url: /
tags:
  - name: auth
  - name: wiki
  - name: review
  - name: assistant
  - name: operations
paths:
  /healthz:
    get:
      tags: [operations]
      operationId: health
      security: []
      responses:
        "200": { $ref: "#/components/responses/Health" }
  /readyz:
    get:
      tags: [operations]
      operationId: readiness
      security: []
      responses:
        "200": { $ref: "#/components/responses/Health" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Authenticated user and CSRF token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      responses:
        "204": { description: Session removed. }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: currentUser
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/pages:
    get:
      tags: [wiki]
      operationId: listOrSearchPages
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { $ref: "#/components/schemas/PageKind" } }
        - { name: includeDrafts, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: Page list or ranked search results when q is supplied.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [pages]
                    properties:
                      pages: { type: array, items: { $ref: "#/components/schemas/Page" } }
                  - type: object
                    required: [results]
                    properties:
                      results: { type: array, items: { $ref: "#/components/schemas/SearchResult" } }
        "401": { $ref: "#/components/responses/Error" }
    post:
      tags: [wiki]
      operationId: createPage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePageRequest" }
      responses:
        "201":
          description: New page with its initial draft revision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PageDetail" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/step-definitions:
    get:
      tags: [wiki]
      operationId: listStepDefinitions
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: role, in: query, schema: { $ref: "#/components/schemas/StepRole" } }
      responses:
        "200":
          description: Approved reusable Gherkin step definitions.
          content:
            application/json:
              schema:
                type: object
                required: [definitions]
                properties:
                  definitions: { type: array, items: { $ref: "#/components/schemas/StepDefinition" } }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/pages/{pageId}:
    parameters:
      - $ref: "#/components/parameters/PageId"
    get:
      tags: [wiki]
      operationId: getPage
      responses:
        "200":
          description: Page with approved and current draft states.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PageDetail" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/pages/{pageId}/revisions:
    parameters:
      - $ref: "#/components/parameters/PageId"
    post:
      tags: [wiki]
      operationId: saveRevision
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveRevisionRequest" }
      responses:
        "201":
          description: New immutable draft revision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Revision" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/revisions/{revisionId}:
    parameters:
      - $ref: "#/components/parameters/RevisionId"
    get:
      tags: [wiki]
      operationId: getRevision
      responses:
        "200":
          description: Exact immutable revision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Revision" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/revisions/{revisionId}/approve:
    parameters:
      - $ref: "#/components/parameters/RevisionId"
    post:
      tags: [review]
      operationId: approveRevision
      responses:
        "200":
          description: Page after atomic approval.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PageDetail" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/revisions/{revisionId}/objections:
    parameters:
      - $ref: "#/components/parameters/RevisionId"
    post:
      tags: [review]
      operationId: raiseObjection
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ObjectionRequest" }
      responses:
        "201":
          description: Blocking objection recorded for the exact revision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Objection" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/comments:
    post:
      tags: [review]
      operationId: createComment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommentRequest" }
      responses:
        "201":
          description: Thread or reply.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/objections/{objectionId}/resolve:
    parameters:
      - name: objectionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [review]
      operationId: resolveObjection
      responses:
        "200":
          description: Resolved objection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Objection" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/audit:
    get:
      tags: [wiki]
      operationId: listAudit
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 80 } }
      responses:
        "200":
          description: Append-only audit events.
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } }
  /api/v1/assistant/status:
    get:
      tags: [assistant]
      operationId: getAssistantStatus
      responses:
        "200":
          description: Connectivity and configuration state of both private Hermes profiles.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantStatus" }
  /api/v1/assistant/conversations:
    get:
      tags: [assistant]
      operationId: listAssistantConversations
      responses:
        "200":
          description: Body-free Viki bindings enriched from authorized Hermes sessions.
          content:
            application/json:
              schema:
                type: object
                required: [conversations]
                properties:
                  conversations: { type: array, items: { $ref: "#/components/schemas/AssistantConversationSummary" } }
    post:
      tags: [assistant]
      operationId: createAssistantConversation
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAssistantConversationRequest" }
      responses:
        "201":
          description: New logical conversation binding. Hermes sessions are created lazily.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantConversation" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/assistant/conversations/{conversationId}:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      tags: [assistant]
      operationId: getAssistantConversation
      responses:
        "200":
          description: Unified Q&A/Edit timeline projected from the paired Hermes sessions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantConversation" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [assistant]
      operationId: updateAssistantConversationSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAssistantConversationSettingsRequest" }
      responses:
        "200":
          description: Updated body-free conversation settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantConversationSummary" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/assistant/conversations/{conversationId}/messages:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    post:
      tags: [assistant]
      operationId: submitAssistantMessage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitAssistantMessageRequest" }
      responses:
        "202":
          description: Hermes accepted the turn. Consume progress from the conversation event stream.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantTurnAccepted" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/assistant/conversations/{conversationId}/events:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      tags: [assistant]
      operationId: streamAssistantEvents
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string }
          description: Last received Viki event identifier for short in-memory replay.
      responses:
        "200":
          description: SSE stream containing only the documented safe assistant event types.
          content:
            text/event-stream:
              schema: { type: string }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/assistant/conversations/{conversationId}/stop:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    post:
      tags: [assistant]
      operationId: stopAssistantTurn
      responses:
        "202": { description: Interruption was forwarded to the active Hermes profile. }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/assistant/conversations/{conversationId}/clarifications/{requestId}:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
      - $ref: "#/components/parameters/ClarificationRequestId"
    post:
      tags: [assistant]
      operationId: respondToAssistantClarification
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssistantClarificationResponse" }
      responses:
        "202": { description: Clarification answer was forwarded to Hermes. }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: viki_session
    CsrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
  parameters:
    PageId:
      name: pageId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RevisionId:
      name: revisionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ClarificationRequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
  responses:
    Error:
      description: Request error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/APIError" }
    Health:
      description: Service status.
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status: { $ref: "#/components/schemas/HealthStatus" }
  schemas:
    HealthStatus:
      type: string
      enum: [ok]
    PageKind:
      type: string
      enum: [concept, feature, scenario]
    ConceptKind:
      type: string
      enum: [noun, verb]
    RevisionStatus:
      type: string
      enum: [draft, approved, superseded]
    DevelopmentStatus:
      type: string
      enum: [queued, running, developed, blocked]
    ReviewReadiness:
      type: string
      enum: [approved, ready, blocked]
    ReviewBlockerType:
      type: string
      enum: [objection, parent_feature]
    AssistantMode:
      type: string
      enum: [qa, edit]
    AssistantConversationState:
      type: string
      enum: [idle, running, awaiting_clarification, stopped, error, unavailable]
    AssistantEventType:
      type: string
      enum: [message_delta, activity, citation, draft_created, clarification, completed, stopped, error]
    BDDKeyword:
      type: string
      enum: [given, when, then, and, but]
    StepRole:
      type: string
      enum: [context, action, outcome]
    User:
      type: object
      required: [id, email, displayName, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        createdAt: { type: string, format: date-time }
    Page:
      type: object
      required: [id, kind, slug, title, approved, hasDraft, unresolvedObjections, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/PageKind" }
        conceptKind: { $ref: "#/components/schemas/ConceptKind" }
        parentId: { type: string, format: uuid }
        slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
        title: { type: string }
        approvedRevisionId: { type: string, format: uuid }
        latestDraftRevisionId: { type: string, format: uuid }
        approvedRevisionTitle: { type: string }
        draftRevisionTitle: { type: string }
        approved: { type: boolean }
        hasDraft: { type: boolean }
        unresolvedObjections: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    BDDStep:
      type: object
      required: [keyword, text, arguments]
      properties:
        id: { type: string, format: uuid }
        stableId: { type: string, format: uuid }
        position: { type: integer, minimum: 0 }
        keyword: { $ref: "#/components/schemas/BDDKeyword" }
        definitionId: { type: string, format: uuid }
        expression: { type: string }
        arguments: { type: array, items: { type: string } }
        text: { type: string, minLength: 1 }
    StepDefinition:
      type: object
      required: [id, expression, role, approved, usageCount]
      properties:
        id: { type: string, format: uuid }
        expression: { type: string }
        role: { $ref: "#/components/schemas/StepRole" }
        approved: { type: boolean }
        usageCount: { type: integer, minimum: 0 }
    PageReference:
      type: object
      required: [relation]
      properties:
        targetPageId: { type: string, format: uuid }
        targetClientKey: { type: string }
        targetTitle: { type: string }
        relation: { type: string }
    RevisionContent:
      type: object
      required: [title, bodyMd, steps, references]
      properties:
        title: { type: string, minLength: 1 }
        bodyMd: { type: string }
        steps: { type: array, items: { $ref: "#/components/schemas/BDDStep" } }
        references: { type: array, items: { $ref: "#/components/schemas/PageReference" } }
    Revision:
      allOf:
        - $ref: "#/components/schemas/RevisionContent"
        - type: object
          required: [id, pageId, number, status, createdBy, createdAt]
          properties:
            id: { type: string, format: uuid }
            pageId: { type: string, format: uuid }
            number: { type: integer, minimum: 1 }
            status: { $ref: "#/components/schemas/RevisionStatus" }
            baseRevisionId: { type: string, format: uuid }
            createdBy: { $ref: "#/components/schemas/User" }
            createdAt: { type: string, format: date-time }
            approvedAt: { type: string, format: date-time }
    RevisionSummary:
      type: object
      required: [id, number, status, title, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        number: { type: integer }
        status: { $ref: "#/components/schemas/RevisionStatus" }
        title: { type: string }
        createdBy: { $ref: "#/components/schemas/User" }
        createdAt: { type: string, format: date-time }
        approvedAt: { type: string, format: date-time }
    Comment:
      type: object
      required: [id, pageId, revisionId, body, author, createdAt, replies]
      properties:
        id: { type: string, format: uuid }
        pageId: { type: string, format: uuid }
        revisionId: { type: string, format: uuid }
        parentCommentId: { type: string, format: uuid }
        body: { type: string }
        author: { $ref: "#/components/schemas/User" }
        createdAt: { type: string, format: date-time }
        replies: { type: array, items: { $ref: "#/components/schemas/Comment" } }
    Objection:
      type: object
      required: [id, pageId, revisionId, revisionNumber, body, author, createdAt]
      properties:
        id: { type: string, format: uuid }
        pageId: { type: string, format: uuid }
        revisionId: { type: string, format: uuid }
        revisionNumber: { type: integer, minimum: 1 }
        body: { type: string }
        author: { $ref: "#/components/schemas/User" }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time }
        resolvedBy: { $ref: "#/components/schemas/User" }
    ReviewBlocker:
      type: object
      required: [id, type]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/ReviewBlockerType" }
        sourceRevisionId: { type: string, format: uuid }
        sourceRevisionNumber: { type: integer, minimum: 1 }
        body: { type: string }
        author: { $ref: "#/components/schemas/User" }
        relatedPageId: { type: string, format: uuid }
        relatedPageTitle: { type: string }
    RevisionReviewState:
      type: object
      required: [revisionId, state, blockers]
      properties:
        revisionId: { type: string, format: uuid }
        state: { $ref: "#/components/schemas/ReviewReadiness" }
        blockers: { type: array, items: { $ref: "#/components/schemas/ReviewBlocker" } }
    PageDetail:
      type: object
      required: [page, revisions, comments, objections, children, reviewStates]
      properties:
        page: { $ref: "#/components/schemas/Page" }
        approvedRevision: { $ref: "#/components/schemas/Revision" }
        draftRevision: { $ref: "#/components/schemas/Revision" }
        revisions: { type: array, items: { $ref: "#/components/schemas/RevisionSummary" } }
        comments: { type: array, items: { $ref: "#/components/schemas/Comment" } }
        objections: { type: array, items: { $ref: "#/components/schemas/Objection" } }
        children: { type: array, items: { $ref: "#/components/schemas/Page" } }
        reviewStates: { type: array, items: { $ref: "#/components/schemas/RevisionReviewState" } }
        development: { $ref: "#/components/schemas/ScenarioDevelopment" }
        developmentProgress: { $ref: "#/components/schemas/FeatureDevelopmentProgress" }
    ScenarioDevelopment:
      type: object
      required: [revisionId, status, detail, updatedAt]
      properties:
        revisionId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/DevelopmentStatus" }
        detail: { type: string }
        updatedAt: { type: string, format: date-time }
    FeatureDevelopmentProgress:
      type: object
      required: [developed, total]
      properties:
        developed: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
    Citation:
      type: object
      required: [revisionId, pageId, pageTitle, draft]
      properties:
        revisionId: { type: string, format: uuid }
        pageId: { type: string, format: uuid }
        pageTitle: { type: string }
        draft: { type: boolean }
    AssistantDraftReceipt:
      type: object
      required: [revisionId, pageId, pageTitle]
      properties:
        revisionId: { type: string, format: uuid }
        pageId: { type: string, format: uuid }
        pageTitle: { type: string }
    AssistantMessage:
      type: object
      required: [id, role, mode, content, citations, drafts, createdAt]
      properties:
        id: { type: string }
        role: { type: string, enum: [user, assistant] }
        mode: { $ref: "#/components/schemas/AssistantMode" }
        content: { type: string }
        citations: { type: array, items: { $ref: "#/components/schemas/Citation" } }
        drafts: { type: array, items: { $ref: "#/components/schemas/AssistantDraftReceipt" } }
        createdAt: { type: string, format: date-time }
    AssistantProfileStatus:
      type: object
      required: [mode, connected, configured, ready]
      properties:
        mode: { $ref: "#/components/schemas/AssistantMode" }
        connected: { type: boolean }
        configured: { type: boolean }
        ready: { type: boolean }
        message: { type: string }
    AssistantStatus:
      type: object
      required: [available, qa, edit]
      properties:
        available: { type: boolean }
        qa: { $ref: "#/components/schemas/AssistantProfileStatus" }
        edit: { $ref: "#/components/schemas/AssistantProfileStatus" }
    AssistantConversationSummary:
      type: object
      required: [id, title, primaryMode, lastMode, state, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        primaryMode: { $ref: "#/components/schemas/AssistantMode" }
        lastMode: { $ref: "#/components/schemas/AssistantMode" }
        state: { $ref: "#/components/schemas/AssistantConversationState" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AssistantClarification:
      type: object
      required: [requestId, mode, message]
      properties:
        requestId: { type: string }
        mode: { $ref: "#/components/schemas/AssistantMode" }
        message: { type: string }
        choices: { type: array, items: { type: string } }
    AssistantConversation:
      allOf:
        - $ref: "#/components/schemas/AssistantConversationSummary"
        - type: object
          required: [messages]
          properties:
            messages: { type: array, items: { $ref: "#/components/schemas/AssistantMessage" } }
            clarification: { $ref: "#/components/schemas/AssistantClarification" }
    CreateAssistantConversationRequest:
      type: object
      properties:
        primaryMode: { $ref: "#/components/schemas/AssistantMode" }
    UpdateAssistantConversationSettingsRequest:
      type: object
      properties:
        primaryMode: { $ref: "#/components/schemas/AssistantMode" }
      minProperties: 1
      additionalProperties: false
    SubmitAssistantMessageRequest:
      type: object
      required: [content, mode]
      properties:
        content: { type: string, minLength: 1, maxLength: 12000 }
        mode: { $ref: "#/components/schemas/AssistantMode" }
      additionalProperties: false
    AssistantTurnAccepted:
      type: object
      required: [turnId, mode]
      properties:
        turnId: { type: string }
        mode: { $ref: "#/components/schemas/AssistantMode" }
    AssistantClarificationResponse:
      type: object
      required: [answer]
      properties:
        answer: { type: string, minLength: 1, maxLength: 12000 }
      additionalProperties: false
    AuditEvent:
      type: object
      required: [id, action, entityType, metadata, createdAt]
      properties:
        id: { type: string, format: uuid }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: string, format: uuid }
        actor: { $ref: "#/components/schemas/User" }
        metadata: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    SearchResult:
      type: object
      required: [page, revisionId, excerpt, score, draft]
      properties:
        page: { $ref: "#/components/schemas/Page" }
        revisionId: { type: string, format: uuid }
        excerpt: { type: string }
        score: { type: number }
        draft: { type: boolean }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }
    LoginResponse:
      type: object
      required: [user, csrfToken]
      properties:
        user: { $ref: "#/components/schemas/User" }
        csrfToken: { type: string }
    CreatePageRequest:
      type: object
      required: [kind, slug, content]
      properties:
        kind: { $ref: "#/components/schemas/PageKind" }
        conceptKind: { $ref: "#/components/schemas/ConceptKind" }
        parentId: { type: string, format: uuid }
        slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
        content: { $ref: "#/components/schemas/RevisionContent" }
        initialScenario:
          description: Required when kind is feature and rejected for every other page kind.
          $ref: "#/components/schemas/InitialScenarioRequest"
    InitialScenarioRequest:
      type: object
      required: [slug, content]
      properties:
        slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
        content: { $ref: "#/components/schemas/RevisionContent" }
    SaveRevisionRequest:
      type: object
      required: [baseRevisionId, content]
      properties:
        baseRevisionId: { type: string, format: uuid }
        content: { $ref: "#/components/schemas/RevisionContent" }
    ObjectionRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1 }
    CommentRequest:
      type: object
      required: [pageId, revisionId, body]
      properties:
        pageId: { type: string, format: uuid }
        revisionId: { type: string, format: uuid }
        body: { type: string, minLength: 1 }
        parentCommentId: { type: string, format: uuid }
    APIError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
security:
  - SessionCookie: []
    CsrfHeader: []
